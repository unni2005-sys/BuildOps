services:
  - type: web
    name: build-ops-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn buildathon_core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SUPABASE_DB_URL
        sync: false
      - key: FRONTEND_URL
        value: https://buildops.co.in
      - key: BACKEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://buildops.co.in,https://www.buildops.co.in
      - key: CSRF_TRUSTED_ORIGINS
        value: https://buildops.co.in,https://www.buildops.co.in
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Build Ops <noreply@buildops.co.in>"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ENV
        value: TEST
      - key: EVENT_NAME
        value: "Build Ops"
      - key: EVENT_DATE
        value: "December 8th, 5:00 PM – December 9th, 9:00 AM, 2026"
      - key: REGISTRATION_FEE_INR
        value: "500"
      - key: WHATSAPP_GROUP_LINK
        sync: false
