name: Keep Render Backend Awake

on:
  # Temporarily paused until public launch — uncomment the 2 lines below to re-enable 10-min pings:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Build Ops Health Endpoint
        run: |
          status=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 60 https://buildops-2bbq.onrender.com/api/health/)
          echo "HTTP $status - $(cat /tmp/health.json)"
          test "$status" -eq 200
